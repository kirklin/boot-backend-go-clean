# mockery configuration
# Docs: https://vektra.github.io/mockery/latest/configuration/
#
# Generate mocks:  make mock
# Mocks output to:  internal/testutil/mock/
#
# When you add a new interface to domain/ (or a pkg/ port such as cache.Cache),
# add it to the 'interfaces' section below and run `make mock` to regenerate.

with-expecter: true
disable-version-string: true
resolve-type-alias: false
issue-845-fix: true
dir: "internal/testutil/mock"
outpkg: "mock"
mockname: "Mock{{.InterfaceName}}"
filename: "mock_{{.InterfaceName | snakecase}}.go"

packages:
  github.com/kirklin/boot-backend-go-clean/internal/domain/repository:
    interfaces:
      UserRepository:
      LoginActivityRepository:
      TxManager:
  github.com/kirklin/boot-backend-go-clean/internal/domain/gateway:
    interfaces:
      Authenticator:
      GeoIPResolver:
  github.com/kirklin/boot-backend-go-clean/internal/domain/usecase:
    interfaces:
      AuthUseCase:
      UserUseCase:
  # Infrastructure ports that live in pkg/. cache.Cache also has a real no-op
  # implementation (cache.NewNoop) — prefer that when a test just needs the
  # calls to go somewhere, and the mock when it needs to assert on them.
  github.com/kirklin/boot-backend-go-clean/pkg/cache:
    interfaces:
      Cache:
  github.com/kirklin/boot-backend-go-clean/pkg/storage:
    interfaces:
      Storage:
